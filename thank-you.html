<!DOCTYPE html>
<html lang="en" class="decor-loaded">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — TECHGURU</title>
    <meta name="description" content="Thank you for reaching out to TechGuru. We will be in touch with you shortly.">
    
    <!-- Link to the main style system -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Auto-redirect back to home after 5 seconds -->
    <meta http-equiv="refresh" content="5;url=/">

    <style>
        .thank-you-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .thank-you-card {
            background: rgba(13, 18, 30, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .thank-you-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(74, 108, 247, 0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .success-icon-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.2) 0%, rgba(5, 150, 105, 0.2) 100%);
            border: 1px solid rgba(52, 211, 153, 0.3);
            margin: 0 auto 30px;
            color: #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.15);
        }

        .success-icon-wrapper svg {
            width: 40px;
            height: 40px;
        }

        .thank-you-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a2a8b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .thank-you-text {
            font-size: 1.15rem;
            color: var(--color-text-secondary, #94a3b8);
            line-height: 1.6;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .redirect-counter {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 25px;
            position: relative;
            z-index: 1;
        }

        .redirect-counter span {
            color: var(--color-primary, #4a6cf7);
            font-weight: 600;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .thank-you-card {
                padding: 40px 20px;
            }
            .thank-you-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <!-- Navbar Header -->
    <header class="navbar" role="banner" style="background: rgba(8, 10, 15, 0.8); backdrop-filter: blur(10px); position: absolute; width: 100%;">
        <div class="logo">
            <a href="/" class="nav-logo-link">
                <img src="images/icons/nav-icon-new.webp" alt="TechGuru Logo" class="nav-logo-icon">
                TECHGURU
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <section class="thank-you-container">
            <div class="thank-you-card">
                <div class="success-icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h1 class="thank-you-title">Message Received!</h1>
                <p class="thank-you-text">
                    Thanks for reaching out to us. We have received your submission and will get back to you within 24 hours.
                </p>
                <a href="/" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px; position: relative; z-index: 1;">
                    <span>← Return to Home</span>
                </a>
                <p class="redirect-counter">
                    Redirecting you back to the home page in <span id="countdown">5</span> seconds...
                </p>
            </div>
        </section>
    </main>

    <script>
        // Simple countdown display script
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds--;
            if (countdownEl) {
                countdownEl.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(interval);
            }
        }, 1000);
    </script>
</body>
</html>
